<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Pro Cloud v5.3</title>
    <style>
        :root { --primary: #d4af37; --dark: #121212; --surface: #1e1e1e; --light: #e0e0e0; --danger: #cf6679; --success: #03dac6; --price: 200; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--light); margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: 20px auto; background: var(--surface); padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 25px; }
        .btn { background: var(--primary); color: black; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 13px; }
        .btn:hover { opacity: 0.8; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .hidden { display: none; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; background: #252525; color: white; box-sizing: border-box; }
        .card { background: #252525; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 4px solid var(--primary); }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .stat-val { display: block; font-size: 22px; font-weight: bold; color: var(--primary); }
        .chart-container { background: #333; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0 25px 0; }
        .chart-bar { background: var(--primary); height: 100%; width: 0%; transition: width 1s ease; }
        .days-nav { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; min-height: 60px; }
        .day-card { min-width: 90px; padding: 10px; background: #252525; text-align: center; border: 2px solid transparent; border-radius: 8px; cursor: pointer; }
        .day-card.active { border-color: var(--primary); background: #333; }
        .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 15px; }
        .slot { padding: 10px; background: #252525; border: 1px solid #444; text-align: center; border-radius: 6px; cursor: pointer; }
        .slot.taken { background: #444; opacity: 0.4; cursor: not-allowed; }
        .setup-grid { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; color:var(--primary)">Barber Master</h1>
            <small id="status-text">Zákaznický režim</small>
        </div>
        <div id="nav-area"><button class="btn" onclick="window.loginPrompt()">Barber Login</button></div>
    </header>

    <div id="view-customer">
        <h3>Rezervace (200 Kč)</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="text" id="cust-name" placeholder="Vaše jméno">
            <input type="email" id="cust-email" placeholder="Váš e-mail">
        </div>
        <p>1. Vyberte den:</p>
        <div id="days-container" class="days-nav">Načítání dnů...</div>
        <p>2. Vyberte čas:</p>
        <div id="slots-container" class="slots-grid">Nejdříve vyberte den.</div>

        <hr style="margin:40px 0; border:0; border-top:1px solid #333">
        <h3>Recenze</h3>
        <div id="reviews-list"></div>
        <div class="card" style="margin-top:20px">
            <h4>Napsat recenzi</h4>
            <input type="text" id="rev-name" placeholder="Jméno">
            <select id="rev-rating"><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option></select>
            <textarea id="rev-text" placeholder="Vaše zkušenost..."></textarea>
            <button class="btn" onclick="window.addReview()">Odeslat recenzi</button>
        </div>
    </div>

    <div id="view-barber" class="hidden">
        <div class="stats-grid">
            <div class="stat-box">Hotovo <span class="stat-val" id="st-count">0</span></div>
            <div class="stat-box">Měsíc <span class="stat-val" id="st-month">0 Kč</span></div>
            <div class="stat-box">Celkem <span class="stat-val" id="st-total">0 Kč</span></div>
        </div>
        <div class="chart-container"><div id="chart-fill" class="chart-bar"></div></div>
        <div style="margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn" onclick="window.renderBarberOrders('pending')">Aktivní fronta</button>
            <button class="btn btn-outline" onclick="window.renderBarberOrders('done')">Historie</button>
            <button class="btn btn-outline" onclick="window.showScheduleSetup()">Nastavit týden</button>
        </div>
        <div id="barber-content"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Konfigurace z tvého obrázku image_2ab85a.png
    const firebaseConfig = {
        apiKey: "AIzaSyCp5hXLowXTeA1Bpvk5WtNKAvkxM1_sLHU",
        authDomain: "projekt-barber-david.firebaseapp.com",
        projectId: "projekt-barber-david",
        storageBucket: "projekt-barber-david.firebasestorage.app",
        messagingSenderId: "704131848134",
        appId: "1:704131848134:web:8a57f69214344b34d3c4c7",
        measurementId: "G-801WCZV8JQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const PRICE = 200;

    let bookings = [];
    let reviews = [];
    let availability = {};
    let selectedDate = null;

    // --- POSLECH DAT (REAL-TIME) ---
    onValue(ref(db, 'bookings'), (snap) => {
        const data = snap.val();
        bookings = data ? Object.entries(data).map(([id, val]) => ({id, ...val})) : [];
        refreshUI();
    });

    onValue(ref(db, 'reviews'), (snap) => {
        const data = snap.val();
        reviews = data ? Object.values(data).reverse() : [];
        renderReviews();
    });

    onValue(ref(db, 'availability'), (snap) => {
        availability = snap.val() || {};
        refreshUI();
    });

    function refreshUI() {
        renderDays();
        if(selectedDate) {
            const conf = availability[selectedDate] || {status:'open', start:8, end:16};
            renderSlots(selectedDate, conf);
        }
        if(!document.getElementById('view-barber').classList.contains('hidden')) {
            updateStats();
        }
    }

    // --- ZÁKAZNICKÁ ČÁST ---
    function getNext7Days() {
        const d = [];
        for(let i=0; i<7; i++) {
            let date = new Date();
            date.setDate(date.getDate() + i);
            // Formát YYYY-MM-DD je bezpečný pro Firebase (žádné tečky)
            d.push(date.toISOString().split('T')[0]);
        }
        return d;
    }

    function renderDays() {
        const container = document.getElementById('days-container');
        container.innerHTML = '';
        getNext7Days().forEach(date => {
            const conf = availability[date] || {status:'open', start:8, end:16};
            if(conf.status === 'open') {
                const card = document.createElement('div');
                card.className = `day-card ${selectedDate === date ? 'active' : ''}`;
                card.innerHTML = `<strong>${date.split('-')[2]}.${date.split('-')[1]}</strong>`;
                card.onclick = () => {
                    selectedDate = date;
                    renderDays();
                    renderSlots(date, conf);
                };
                container.appendChild(card);
            }
        });
    }

    function renderSlots(date, conf) {
        const container = document.getElementById('slots-container');
        container.innerHTML = '';
        for(let h = conf.start; h < conf.end; h++) {
            const time = `${h.toString().padStart(2,'0')}:00`;
            const taken = bookings.some(b => b.date === date && b.time === time);
            const slot = document.createElement('div');
            slot.className = `slot ${taken ? 'taken' : ''}`;
            slot.innerText = time;
            if(!taken) slot.onclick = () => {
                const name = document.getElementById('cust-name').value.trim();
                const email = document.getElementById('cust-email').value.trim();
                if(!name || !email) return alert("Prosím vyplňte jméno a e-mail.");
                
                push(ref(db, 'bookings'), {
                    name, email, date, time, status: 'pending'
                }).then(() => alert("Rezervováno!"));
            };
            container.appendChild(slot);
        }
    }

    // --- RECENZE ---
    window.addReview = () => {
        const n = document.getElementById('rev-name').value.trim();
        const t = document.getElementById('rev-text').value.trim();
        if(!n || !t) return alert("Napište jméno a text recenze.");
        push(ref(db, 'reviews'), {
            name: n, text: t, rating: document.getElementById('rev-rating').value, date: new Date().toLocaleDateString()
        });
        document.getElementById('rev-text').value = "";
    };

    function renderReviews() {
        document.getElementById('reviews-list').innerHTML = reviews.map(r => `
            <div style="border-bottom:1px solid #333; padding:10px 0;">
                <strong>${r.name}</strong> ${"⭐".repeat(r.rating)}<br><small>${r.text}</small>
            </div>`).join('') || "Zatím žádné recenze.";
    }

    // --- BARBER ADMIN ---
    window.loginPrompt = () => {
        if(prompt("Heslo:") === "1234") {
            document.getElementById('view-customer').classList.add('hidden');
            document.getElementById('view-barber').classList.remove('hidden');
            updateStats();
            renderBarberOrders('pending');
        }
    };

    window.showScheduleSetup = () => {
        const container = document.getElementById('barber-content');
        let html = `<h3>Nastavení otevírací doby</h3>`;
        getNext7Days().forEach(date => {
            const conf = availability[date] || {status:'open', start:8, end:16};
            html += `<div class="setup-grid" data-date="${date}">
                <strong>${date}</strong>
                <select class="set-status"><option value="open" ${conf.status==='open'?'selected':''}>Otevřeno</option><option value="closed" ${conf.status==='closed'?'selected':''}>Zavřeno</option></select>
                <input type="number" class="set-start" value="${conf.start}" min="0" max="23">
                <input type="number" class="set-end" value="${conf.end}" min="0" max="23">
            </div>`;
        });
        html += `<button class="btn btn-success" style="width:100%" onclick="window.saveSchedule()">ULOŽIT DO DATABÁZE</button>`;
        container.innerHTML = html;
    };

    window.saveSchedule = () => {
        const data = {};
        document.querySelectorAll('.setup-grid').forEach(el => {
            data[el.dataset.date] = {
                status: el.querySelector('.set-status').value,
                start: parseInt(el.querySelector('.set-start').value),
                end: parseInt(el.querySelector('.set-end').value)
            };
        });
        set(ref(db, 'availability'), data).then(() => alert("Rozvrh uložen v cloudu!"));
    };

    window.renderBarberOrders = (status) => {
        const container = document.getElementById('barber-content');
        container.innerHTML = `<h3>${status === 'pending' ? 'Aktivní rezervace' : 'Historie'}</h3>`;
        bookings.filter(b => b.status === status).forEach(b => {
            const div = document.createElement('div');
            div.className = 'card flex-between';
            div.innerHTML = `<div><strong>${b.date} v ${b.time}</strong><br>${b.name}</div>
                <button class="btn btn-success" onclick="window.updateStatus('${b.id}', 'done')">✓</button>`;
            container.appendChild(div);
        });
    };

    window.updateStatus = (id, stat) => update(ref(db, `bookings/${id}`), {status: stat});

    function updateStats() {
        const done = bookings.filter(b => b.status === 'done').length;
        document.getElementById('st-count').innerText = done;
        document.getElementById('st-total').innerText = (done * PRICE) + " Kč";
    }

    // Spuštění
    renderDays();

</script>
</body>
</html>
