<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRS King Barber</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a; --surface: #161616; --text: #ffffff; --text-dim: #a0a0a0;
            --card-bg: #202020; --input-bg: #202020; --gold: #d4af37; --gold-dark: #aa8c2c;
            --border: #333; --slot-taken: #111; --slot-text-taken: #444; --danger: #ff4444;
        }

        [data-theme="light"] {
            --bg: #f5f5f5; --surface: #ffffff; --text: #1a1a1a; --text-dim: #555555;
            --card-bg: #f9f9f9; --input-bg: #ffffff; --gold: #b8860b; --gold-dark: #8b6508;
            --border: #dddddd; --slot-taken: #eeeeee; --slot-text-taken: #bbbbbb;
        }

        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        .container { max-width: 800px; margin: 40px auto; background: var(--surface); padding: 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 1px solid var(--border); }
        
        header { text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; position: relative; }
        .theme-toggle { position: absolute; top: 0; right: 0; background: var(--gold); color: #000; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.7rem; text-transform: uppercase; }
        
        .logo-img { width: 140px; height: 140px; object-fit: cover; border-radius: 50%; border: 3px solid var(--gold); margin-bottom: 15px; }
        h1 { font-family: 'Goldman', cursive; color: var(--gold); text-transform: uppercase; letter-spacing: 3px; margin: 0; }

        .btn { background: var(--gold); color: #000; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; transition: 0.3s; text-transform: uppercase; text-decoration: none; display: inline-block; }
        .btn-outline { background: transparent; border: 2px solid var(--gold); color: var(--gold); }
        .btn-danger { background: var(--danger); color: white; padding: 8px 12px; font-size: 0.8rem; border: none; border-radius: 8px; cursor: pointer; }
        .btn-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white; border: none; font-size: 1.1rem; padding: 15px 30px; border-radius: 30px; font-weight: bold; width: 100%; box-sizing: border-box; margin-top: 20px; text-align: center;}
        .btn-ig:hover { transform: scale(1.02); filter: brightness(1.1); }

        .hidden { display: none; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); box-sizing: border-box; }

        .days-nav { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; }
        .day-card { min-width: 80px; padding: 15px; background: var(--card-bg); text-align: center; border-radius: 15px; cursor: pointer; border: 2px solid transparent; }
        .day-card.active { border-color: var(--gold); background: rgba(212, 175, 55, 0.1); }

        .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; }
        .slot { padding: 12px; background: var(--card-bg); border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid var(--border); }
        .slot.taken { background: var(--slot-taken); color: var(--slot-text-taken); text-decoration: line-through; cursor: not-allowed; }

        .barber-stats { background: var(--card-bg); padding: 25px; border-radius: 15px; margin-bottom: 20px; text-align: center; border: 1px solid var(--gold); }
        .progress-container { background: var(--bg); height: 18px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 1px solid var(--border); }
        .progress-bar { height: 100%; width: 0%; transition: width 0.8s ease; background: var(--gold); }
        
        @keyframes godMode { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .god-bar { background: linear-gradient(270deg, #ff0000, #ff7f00, #d4af37, #00ff00, #00e5ff, #9933ff, #ff00ff); background-size: 400% 400%; animation: godMode 3s ease infinite; }

        .card { background: var(--card-bg); padding: 20px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid var(--gold); }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .setup-grid { display: grid; grid-template-columns: 1.5fr 1.5fr 1fr 1fr; gap: 10px; align-items: center; border-bottom: 1px solid var(--border); padding: 5px 0; }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <header>
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">Světlý mód</button>
        <img src="haircut.jpeg" alt="SRS King Barber" class="logo-img">
        <h1>SRS King Barber</h1>
        <div id="nav-area" style="margin-top: 25px;">
            <button class="btn btn-outline" id="admin-login-btn" onclick="window.loginPrompt()">Vstup pro Barbera</button>
        </div>
    </header>

    <div id="view-customer">
        <div class="card">
            <h3 style="margin:0; color:var(--gold)">Rezervace termínu</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="text" id="cust-name" placeholder="Vaše jméno">
                <input type="email" id="cust-email" placeholder="Váš e-mail (pro potvrzení)">
            </div>
            <p style="color: var(--text-dim); font-size: 0.9rem;">Vyberte den (v rozmezí 15 dní):</p>
            <div id="days-container" class="days-nav">Načítání...</div>
            <div id="slots-container" class="slots-grid" style="margin-top:20px;"></div>
        </div>
        
        <a href="https://www.instagram.com/proste_dejvv_?igsh=MTZubDVmOWpjd2EycA==" target="_blank" class="btn btn-ig">
            📸 Sledujte mě na Instagramu
        </a>
    </div>

    <div id="view-barber" class="hidden">
        <div class="barber-stats">
            <span class="level-badge" id="barber-level-text" style="font-family:'Goldman'; font-size:1.5rem;">LEVEL 1</span>
            <div class="progress-container"><div id="chart-fill" class="progress-bar"></div></div>
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                <span>Ostříháno: <strong id="st-count">0</strong></span>
                <span id="st-next">Do dalšího levelu: X</span>
            </div>
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="btn" style="flex:1" onclick="window.renderBarberOrders('pending')">Aktivní</button>
            <button class="btn btn-outline" style="flex:1" onclick="window.renderBarberOrders('done')">Historie</button>
            <button class="btn btn-outline" onclick="window.showScheduleSetup()">📅</button>
        </div>
        <div id="barber-content"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp5hXLowXTeA1Bpvk5WtNKAvkxM1_sLHU",
        authDomain: "projekt-barber-david.firebaseapp.com",
        projectId: "projekt-barber-david",
        storageBucket: "projekt-barber-david.firebasestorage.app",
        messagingSenderId: "704131848134",
        appId: "1:704131848134:web:8a57f69214344b34d3c4c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let bookings = [];
    let availability = {};
    let selectedDate = null;
    let isAdmin = false;

    // Notifikace pro Barbera
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }

    window.toggleTheme = () => {
        const b = document.body;
        const isDark = b.getAttribute('data-theme') === 'dark';
        b.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('theme-btn').innerText = isDark ? "Tmavý mód" : "Světlý mód";
    };

    function getDays() {
        const d = [];
        for(let i=0; i<15; i++) {
            let date = new Date();
            date.setDate(date.getDate() + i);
            d.push(date.toISOString().split('T')[0]);
        }
        return d;
    }

    onValue(ref(db, 'bookings'), (s) => {
        const data = s.val();
        bookings = data ? Object.entries(data).map(([id, v]) => ({id, ...v})) : [];
        refresh();
    });

    onValue(ref(db, 'availability'), (s) => {
        availability = s.val() || {};
        refresh();
    });

    function refresh() {
        renderDays();
        if(selectedDate) renderSlots(selectedDate, availability[selectedDate] || {status:'open', start:8, end:16});
        if(isAdmin) {
            updateStats();
            const title = document.querySelector('#barber-content h3');
            if(title) {
                if(title.innerText === 'Aktivní') window.renderBarberOrders('pending');
                else if(title.innerText === 'Historie') window.renderBarberOrders('done');
            }
        }
    }

    function renderDays() {
        const c = document.getElementById('days-container');
        c.innerHTML = '';
        getDays().forEach(date => {
            const conf = availability[date] || {status:'open'};
            if(conf.status === 'open') {
                const card = document.createElement('div');
                card.className = `day-card ${selectedDate === date ? 'active' : ''}`;
                card.innerHTML = `<strong>${date.split('-')[2]}.${date.split('-')[1]}.</strong>`;
                card.onclick = () => { selectedDate = date; refresh(); };
                c.appendChild(card);
            }
        });
    }

    function renderSlots(date, conf) {
        const c = document.getElementById('slots-container');
        c.innerHTML = '';
        for(let h = conf.start; h < conf.end; h++) {
            const time = `${h.toString().padStart(2,'0')}:00`;
            const taken = bookings.some(b => b.date === date && b.time === time);
            const slot = document.createElement('div');
            slot.className = `slot ${taken ? 'taken' : ''}`;
            slot.innerText = time;
            if(!taken) slot.onclick = () => {
                const name = document.getElementById('cust-name').value;
                const email = document.getElementById('cust-email').value;
                if(!name || !email) return alert("Zadejte jméno a e-mail.");
                if(confirm(`Rezervovat ${date} v ${time}?`)) {
                    push(ref(db, 'bookings'), {name, email, date, time, status:'pending'});
                    alert("Rezervace odeslána! Těšíme se na Vás.");
                }
            };
            c.appendChild(slot);
        }
    }

    window.loginPrompt = () => {
        if(prompt("Kód (1234):") === "1234") {
            isAdmin = true;
            document.getElementById('view-customer').classList.add('hidden');
            document.getElementById('view-barber').classList.remove('hidden');
            document.getElementById('admin-login-btn').classList.add('hidden');
            window.renderBarberOrders('pending');
            updateStats();
        }
    };

    window.updateStats = () => {
        const done = bookings.filter(b => b.status === 'done').length;
        let lvl = 1, xpNext = 5, xpPrev = 0;
        while(done >= xpNext) { lvl++; xpPrev = xpNext; xpNext = Math.ceil(xpNext * 1.333); }
        const prog = ((done - xpPrev) / (xpNext - xpPrev)) * 100;
        const bar = document.getElementById('chart-fill');
        bar.style.width = prog + "%";
        document.getElementById('barber-level-text').innerText = `LEVEL ${lvl}`;
        document.getElementById('st-count').innerText = done;
        document.getElementById('st-next').innerText = xpNext - done;
        bar.className = lvl >= 15 ? "progress-bar god-bar" : "progress-bar";
    };

    window.renderBarberOrders = (stat) => {
        const c = document.getElementById('barber-content');
        c.innerHTML = `<h3>${stat === 'pending' ? 'Aktivní' : 'Historie'}</h3>`;
        bookings.filter(b => b.status === stat).sort((a,b) => a.date.localeCompare(b.date)).forEach(b => {
            const d = document.createElement('div');
            d.className = 'card flex-between';
            const safeEmail = b.email || '';
            d.innerHTML = `<div><strong style="color:var(--gold)">${b.date} v ${b.time}</strong><br>${b.name} <br><small style="color:var(--text-dim)">${safeEmail}</small></div>
                <div style="display:flex; gap:5px;">
                    ${stat==='pending' ? `<button class="btn" style="padding:8px" onclick="window.updStatus('${b.id}','done')">✓</button>` : ''}
                    <button class="btn-danger" onclick="window.delBooking('${b.id}', '${safeEmail}', '${b.name}')">Zrušit</button>
                </div>`;
            c.appendChild(d);
        });
    };

    window.updStatus = (id, s) => update(ref(db, `bookings/${id}`), {status: s});
    
    window.delBooking = (id, email, name) => { 
        if(confirm(`Opravdu zrušit objednávku pro klienta ${name}?`)) { 
            if(email) {
                const subject = encodeURIComponent("Zrušení termínu - SRS King Barber");
                const body = encodeURIComponent(`Dobrý den ${name},\n\nvelice se omlouváme, ale z provozních důvodů jsme bohužel nuceni Vaši rezervaci na SRS King Barber zrušit.\n\nProsím, vyberte si jiný termín na našem webu.\n\nDěkujeme za pochopení.`);
                window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
            }
            remove(ref(db, `bookings/${id}`)); 
        } 
    };

    window.showScheduleSetup = () => {
        const c = document.getElementById('barber-content');
        c.innerHTML = '<h3>Rozvrh (15 dní)</h3>';
        getDays().forEach(date => {
            const conf = availability[date] || {status:'open', start:8, end:16};
            c.innerHTML += `<div class="setup-grid" data-date="${date}">
                <span style="font-size:0.8rem">${date}</span>
                <select class="s-stat"><option value="open" ${conf.status==='open'?'selected':''}>OK</option><option value="closed" ${conf.status==='closed'?'selected':''}>X</option></select>
                <input type="number" class="s-start" value="${conf.start}">
                <input type="number" class="s-end" value="${conf.end}">
            </div>`;
        });
        c.innerHTML += '<button class="btn" style="width:100%; margin-top:10px" onclick="window.saveSch()">Uložit</button>';
    };

    window.saveSch = () => {
        const data = {};
        document.querySelectorAll('.setup-grid').forEach(el => {
            data[el.dataset.date] = {
                status: el.querySelector('.s-stat').value,
                start: parseInt(el.querySelector('.s-start').value),
                end: parseInt(el.querySelector('.s-end').value)
            };
        });
        set(ref(db, 'availability'), data).then(() => alert("Uloženo!"));
    };

    // Kontrola 20 min předem
    setInterval(() => {
        if(!isAdmin) return;
        const now = new Date();
        const currentDate = now.toISOString().split('T')[0];
        bookings.filter(b => b.status === 'pending' && b.date === currentDate).forEach(b => {
            const [H, M] = b.time.split(':');
            const bookTime = new Date();
            bookTime.setHours(parseInt(H), parseInt(M), 0, 0);
            const diffMins = Math.floor((bookTime - now) / 60000);
            if(diffMins === 20 && !b.notified) {
                const msg = `Za 20 minut stříháš: ${b.name} (${b.time})`;
                if (Notification.permission === "granted") new Notification("Další stříhání!", { body: msg });
                else alert(msg);
                update(ref(db, `bookings/${b.id}`), {notified: true});
            }
        });
    }, 60000);

    refresh();
</script>
</body>
</html>
