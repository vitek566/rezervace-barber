<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRS King Barber - Pro Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #d4af37; --dark: #0a0a0a; --surface: #161616; --light: #e0e0e0; 
            --danger: #ff4444; --success: #00c853; --border: #333;
        }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--dark); color: var(--light); margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: 20px auto; background: var(--surface); padding: 25px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        header { text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; }
        h1 { font-family: 'Goldman', cursive; color: var(--primary); text-transform: uppercase; letter-spacing: 3px; margin: 0; }
        
        .btn { background: var(--primary); color: black; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; }
        .btn:hover { transform: scale(1.02); opacity: 0.9; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-danger { background: var(--danger); color: white; }
        
        .hidden { display: none; }
        input, select, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--border); background: #202020; color: white; box-sizing: border-box; }
        
        .card { background: #202020; padding: 20px; margin-bottom: 15px; border-radius: 15px; border-left: 5px solid var(--primary); }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        
        /* Stats & Level Bar */
        .barber-stats { background: #202020; padding: 25px; border-radius: 15px; margin-bottom: 25px; text-align: center; border: 1px solid var(--primary); }
        .level-text { font-family: 'Goldman'; font-size: 1.8rem; color: var(--primary); margin-bottom: 10px; display: block; }
        .progress-container { background: #000; height: 18px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 1px solid var(--border); }
        .progress-bar { height: 100%; width: 0%; transition: width 0.8s ease; background: var(--primary); box-shadow: 0 0 15px var(--primary); }
        .stats-info { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: bold; }

        .days-nav { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; }
        .day-card { min-width: 85px; padding: 15px; background: #252525; text-align: center; border-radius: 12px; cursor: pointer; border: 2px solid transparent; }
        .day-card.active { border-color: var(--primary); background: rgba(212, 175, 55, 0.1); }
        
        .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 12px; margin-top: 15px; }
        .slot { padding: 12px; background: #252525; border: 1px solid var(--border); text-align: center; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .slot.taken { background: #111; color: #444; text-decoration: line-through; cursor: not-allowed; }
        
        .setup-grid { display: grid; grid-template-columns: 1.5fr 1.5fr 1fr 1fr; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SRS King Barber</h1>
        <div id="nav-area" style="margin-top: 20px;">
            <button class="btn btn-outline" id="admin-login-btn" onclick="window.loginPrompt()">Vstup pro Barbera</button>
        </div>
    </header>

    <div id="view-customer">
        <div class="card">
            <h3 style="margin:0; color:var(--primary)">Rezervace termínu</h3>
            <input type="text" id="cust-name" placeholder="Vaše jméno">
            <div id="days-container" class="days-nav">Načítání dnů...</div>
            <div id="slots-container" class="slots-grid"></div>
        </div>
    </div>

    <div id="view-barber" class="hidden">
        <div class="barber-stats">
            <span class="level-text" id="barber-level-text">LEVEL 1</span>
            <div class="progress-container"><div id="chart-fill" class="progress-bar"></div></div>
            <div class="stats-info">
                <span>Ostříháno: <strong id="st-count">0</strong></span>
                <span>Do dalšího levelu zbývá: <strong id="st-next">?</strong></span>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 25px;">
            <button class="btn" style="flex:1" onclick="window.renderBarberOrders('pending')">Aktivní</button>
            <button class="btn btn-outline" style="flex:1" onclick="window.renderBarberOrders('done')">Historie</button>
            <button class="btn btn-outline" onclick="window.showScheduleSetup()">📅</button>
        </div>
        <div id="barber-content"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp5hXLowXTeA1Bpvk5WtNKAvkxM1_sLHU",
        authDomain: "projekt-barber-david.firebaseapp.com",
        projectId: "projekt-barber-david",
        storageBucket: "projekt-barber-david.firebasestorage.app",
        messagingSenderId: "704131848134",
        appId: "1:704131848134:web:8a57f69214344b34d3c4c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let bookings = [];
    let availability = {};
    let selectedDate = null;
    let isAdmin = false;
    let currentView = 'pending';

    // --- POSLECH DAT ---
    onValue(ref(db, 'bookings'), (snap) => {
        const data = snap.val();
        bookings = data ? Object.entries(data).map(([id, val]) => ({id, ...val})) : [];
        refreshUI();
    });

    onValue(ref(db, 'availability'), (snap) => {
        availability = snap.val() || {};
        refreshUI();
    });

    function refreshUI() {
        renderDays();
        if(selectedDate) {
            const conf = availability[selectedDate] || {status:'open', start:8, end:16};
            renderSlots(selectedDate, conf);
        }
        if(isAdmin) {
            updateStats();
            renderBarberOrders(currentView);
        }
    }

    // --- KALENDÁŘ ---
    function renderDays() {
        const container = document.getElementById('days-container');
        container.innerHTML = '';
        for(let i=0; i<14; i++) {
            let dateObj = new Date();
            dateObj.setDate(dateObj.getDate() + i);
            let dateStr = dateObj.toISOString().split('T')[0];
            const conf = availability[dateStr] || {status:'open'};

            if(conf.status === 'open' || isAdmin) {
                const card = document.createElement('div');
                card.className = `day-card ${selectedDate === dateStr ? 'active' : ''}`;
                card.innerHTML = `<strong>${dateStr.split('-')[2]}.${dateStr.split('-')[1]}.</strong>`;
                card.onclick = () => { selectedDate = dateStr; refreshUI(); };
                container.appendChild(card);
            }
        }
    }

    function renderSlots(date, conf) {
        const container = document.getElementById('slots-container');
        container.innerHTML = '';
        for(let h = conf.start; h < conf.end; h++) {
            const time = `${h.toString().padStart(2,'0')}:00`;
            const taken = bookings.some(b => b.date === date && b.time === time);
            const slot = document.createElement('div');
            slot.className = `slot ${taken ? 'taken' : ''}`;
            slot.innerText = time;
            if(!taken) slot.onclick = () => {
                const name = document.getElementById('cust-name').value.trim();
                if(!name) return alert("Zadej své jméno!");
                if(confirm(`Rezervovat na ${date} v ${time}?`)) {
                    push(ref(db, 'bookings'), { name, date, time, status: 'pending' });
                }
            };
            container.appendChild(slot);
        }
    }

    // --- BARBER SEKCE ---
    window.loginPrompt = () => {
        if(prompt("Kód Barbera:") === "1234") { // Změň si heslo dle potřeby
            isAdmin = true;
            document.getElementById('view-customer').classList.add('hidden');
            document.getElementById('view-barber').classList.remove('hidden');
            document.getElementById('admin-login-btn').classList.add('hidden');
            refreshUI();
        }
    };

    window.renderBarberOrders = (view) => {
        currentView = view;
        const container = document.getElementById('barber-content');
        if(!container) return;
        container.innerHTML = `<h3>${view === 'pending' ? 'Aktivní klienti' : 'Historie (Hotovo)'}</h3>`;
        
        const filtered = bookings.filter(b => b.status === view).sort((a,b) => a.date.localeCompare(b.date));
        
        if(filtered.length === 0) container.innerHTML += "<p>Žádné záznamy.</p>";

        filtered.forEach(b => {
            const div = document.createElement('div');
            div.className = 'card flex-between';
            div.innerHTML = `<div><strong>${b.date} v ${b.time}</strong><br>${b.name}</div>
                <div style="display:flex; gap:10px;">
                    ${view === 'pending' ? `<button class="btn" style="background:var(--success)" onclick="window.updateStatus('${b.id}', 'done')">Hotovo</button>` : ''}
                    <button class="btn btn-danger" onclick="window.deleteOrder('${b.id}')">X</button>
                </div>`;
            container.appendChild(div);
        });
    };

    window.updateStatus = (id, stat) => {
        update(ref(db, `bookings/${id}`), {status: stat});
    };

    window.deleteOrder = (id) => {
        if(confirm("Opravdu smazat?")) remove(ref(db, `bookings/${id}`));
    };

    window.showScheduleSetup = () => {
        const container = document.getElementById('barber-content');
        container.innerHTML = `<h3>Nastavení týdne</h3>`;
        for(let i=0; i<7; i++) {
            let d = new Date(); d.setDate(d.getDate() + i);
            let ds = d.toISOString().split('T')[0];
            const conf = availability[ds] || {status:'open', start:8, end:16};
            container.innerHTML += `<div class="setup-grid" data-date="${ds}">
                <strong>${ds}</strong>
                <select class="set-status">
                    <option value="open" ${conf.status==='open'?'selected':''}>Otevřeno</option>
                    <option value="closed" ${conf.status==='closed'?'selected':''}>Zavřeno</option>
                </select>
                <input type="number" class="set-start" value="${conf.start}" title="Od">
                <input type="number" class="set-end" value="${conf.end}" title="Do">
            </div>`;
        }
        container.innerHTML += `<button class="btn" style="width:100%; margin-top:15px;" onclick="window.saveSchedule()">Uložit rozvrh</button>`;
    };

    window.saveSchedule = () => {
        const data = {};
        document.querySelectorAll('.setup-grid').forEach(el => {
            data[el.dataset.date] = {
                status: el.querySelector('.set-status').value,
                start: parseInt(el.querySelector('.set-start').value),
                end: parseInt(el.querySelector('.set-end').value)
            };
        });
        set(ref(db, 'availability'), data).then(() => alert("Uloženo!"));
    };

    // --- LEVEL SYSTÉM & PROGRESS BAR ---
    function updateStats() {
        const doneCount = bookings.filter(b => b.status === 'done').length;
        
        // Logika levelů: Každý level vyžaduje určitý počet ostříhání
        // Level 1: 0-10, Level 2: 11-25, Level 3: 26-50, atd.
        let level = 1;
        let xpNext = 10;
        let xpPrev = 0;

        if (doneCount >= 10) { level = 2; xpPrev = 10; xpNext = 25; }
        if (doneCount >= 25) { level = 3; xpPrev = 25; xpNext = 50; }
        if (doneCount >= 50) { level = 4; xpPrev = 50; xpNext = 100; }
        if (doneCount >= 100) { level = 5; xpPrev = 100; xpNext = 250; }

        const zbývá = xpNext - doneCount;
        const procenta = ((doneCount - xpPrev) / (xpNext - xpPrev)) * 100;

        document.getElementById('barber-level-text').innerText = `LEVEL ${level}`;
        document.getElementById('st-count').innerText = doneCount;
        document.getElementById('st-next').innerText = zbývá > 0 ? zbývá : "MAX";
        document.getElementById('chart-fill').style.width = `${Math.min(procenta, 100)}%`;
    }

</script>
</body>
</html>
