<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRS King Barber</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-dark: #aa8c2c;
            --bg: #0a0a0a;
            --surface: #161616;
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid #222;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #222;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .logo-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Goldman', cursive;
            font-size: 2.5rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
        }

        .status-badge {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            border: 1px solid var(--gold);
            display: inline-block;
            margin-top: 10px;
        }

        .btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
        }

        .hidden { display: none; }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #333;
            background: #202020;
            color: white;
        }

        .days-nav {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) #222;
        }

        .day-card {
            min-width: 80px;
            padding: 15px;
            background: #202020;
            text-align: center;
            border-radius: 15px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .day-card.active {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .slot {
            padding: 12px;
            background: #202020;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #333;
        }

        .slot.taken {
            background: #111;
            color: #444;
            text-decoration: line-through;
            cursor: not-allowed;
        }

        .barber-stats {
            background: #202020;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid var(--gold);
        }

        .level-badge {
            font-family: 'Goldman';
            font-size: 1.5rem;
            color: var(--text);
            display: block;
        }

        .progress-container {
            background: #111;
            height: 18px;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
            border: 1px solid #333;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            transition: width 0.8s ease;
        }

        @keyframes godMode {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .god-bar {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #d4af37, #00ff00, #00e5ff, #9933ff, #ff00ff);
            background-size: 400% 400%;
            animation: godMode 3s ease infinite;
        }

        .card {
            background: #202020;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            border-left: 5px solid var(--gold);
        }

        .setup-grid {
            display: grid;
            grid-template-columns: 1.5fr 1.5fr 1fr 1fr;
            gap: 10px;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="haircut.jpeg" alt="SRS King Barber" class="logo-img">
        <h1>SRS King Barber</h1>
        <div><span class="status-badge" id="status-text">Zákaznický panel</span></div>
        <div id="nav-area" style="margin-top: 25px;">
            <button class="btn btn-outline" onclick="window.loginPrompt()">Vstup pro Barbera</button>
        </div>
    </header>

    <div id="view-customer">
        <div class="card">
            <h3 style="margin-top:0; color:var(--gold)">Rezervace termínu</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="text" id="cust-name" placeholder="Vaše jméno">
                <input type="email" id="cust-email" placeholder="Váš e-mail">
            </div>
            <p style="color: var(--text-dim);">1. Vyberte si den (nabídka na 15 dní):</p>
            <div id="days-container" class="days-nav">Načítání...</div>
            <p style="color: var(--text-dim);">2. Vyberte volný čas:</p>
            <div id="slots-container" class="slots-grid">Vyberte den pro zobrazení časů.</div>
        </div>

        <div id="reviews-list"></div>
    </div>

    <div id="view-barber" class="hidden">
        <div class="barber-stats">
            <span class="level-badge" id="barber-level-text">LEVEL 1</span>
            <div class="progress-container">
                <div id="chart-fill" class="progress-bar"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                <span>XP: <strong id="st-count">0</strong></span>
                <span id="st-next">Další level za: X</span>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 25px;">
            <button class="btn" style="flex:1" onclick="window.renderBarberOrders('pending')">Aktivní</button>
            <button class="btn btn-outline" style="flex:1" onclick="window.renderBarberOrders('done')">Historie</button>
            <button class="btn btn-outline" onclick="window.showScheduleSetup()">📅 Nastavení 15 dní</button>
        </div>
        <div id="barber-content"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCp5hXLowXTeA1Bpvk5WtNKAvkxM1_sLHU",
        authDomain: "projekt-barber-david.firebaseapp.com",
        projectId: "projekt-barber-david",
        storageBucket: "projekt-barber-david.firebasestorage.app",
        messagingSenderId: "704131848134",
        appId: "1:704131848134:web:8a57f69214344b34d3c4c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let bookings = [];
    let availability = {};
    let selectedDate = null;

    // --- KLÍČOVÁ ZMĚNA: ROZMEZÍ 15 DNÍ ---
    function getDaysRange(count = 15) {
        const d = [];
        for(let i=0; i<count; i++) {
            let date = new Date();
            date.setDate(date.getDate() + i);
            d.push(date.toISOString().split('T')[0]);
        }
        return d;
    }

    onValue(ref(db, 'bookings'), (snap) => {
        const data = snap.val();
        bookings = data ? Object.entries(data).map(([id, val]) => ({id, ...val})) : [];
        refreshUI();
    });

    onValue(ref(db, 'availability'), (snap) => {
        availability = snap.val() || {};
        refreshUI();
    });

    function refreshUI() {
        renderDays();
        if(selectedDate) {
            const conf = availability[selectedDate] || {status:'open', start:8, end:16};
            renderSlots(selectedDate, conf);
        }
        if(!document.getElementById('view-barber').classList.contains('hidden')) updateStats();
    }

    function renderDays() {
        const container = document.getElementById('days-container');
        if(!container) return;
        container.innerHTML = '';
        getDaysRange(15).forEach(date => {
            const conf = availability[date] || {status:'open', start:8, end:16};
            if(conf.status === 'open') {
                const card = document.createElement('div');
                card.className = `day-card ${selectedDate === date ? 'active' : ''}`;
                const [y, m, d] = date.split('-');
                card.innerHTML = `<span style="font-size:0.7rem">${m}/${y}</span><br><strong>${d}</strong>`;
                card.onclick = () => { selectedDate = date; renderDays(); renderSlots(date, conf); };
                container.appendChild(card);
            }
        });
    }

    function renderSlots(date, conf) {
        const container = document.getElementById('slots-container');
        container.innerHTML = '';
        for(let h = conf.start; h < conf.end; h++) {
            const time = `${h.toString().padStart(2,'0')}:00`;
            const taken = bookings.some(b => b.date === date && b.time === time);
            const slot = document.createElement('div');
            slot.className = `slot ${taken ? 'taken' : ''}`;
            slot.innerText = time;
            if(!taken) slot.onclick = () => {
                const name = document.getElementById('cust-name').value.trim();
                if(!name) return alert("Zadejte jméno.");
                if(confirm(`Opravdu chcete termín ${date} v ${time}?`)) {
                    push(ref(db, 'bookings'), { name, date, time, status: 'pending' });
                }
            };
            container.appendChild(slot);
        }
    }

    window.loginPrompt = () => {
        if(prompt("Kód:") === "1234") {
            document.getElementById('view-customer').classList.add('hidden');
            document.getElementById('view-barber').classList.remove('hidden');
            updateStats();
            renderBarberOrders('pending');
        }
    };

    window.updateStats = () => {
        const doneCount = bookings.filter(b => b.status === 'done').length;
        document.getElementById('st-count').innerText = doneCount;

        let currentLevel = 1, xpThis = 0, xpNext = 5;
        while (doneCount >= xpNext) {
            currentLevel++;
            xpThis = xpNext;
            xpNext = Math.ceil(xpNext * 1.333);
        }
        const progress = Math.min(((doneCount - xpThis) / (xpNext - xpThis)) * 100, 100);
        const bar = document.getElementById('chart-fill');
        bar.style.width = progress + "%";
        document.getElementById('barber-level-text').innerText = `LEVEL ${currentLevel}`;
        document.getElementById('st-next').innerText = `Další za: ${xpNext - doneCount}`;
        
        if(currentLevel >= 15) bar.className = "progress-bar god-bar";
        else bar.style.background = "var(--gold)";
    };

    window.showScheduleSetup = () => {
        const container = document.getElementById('barber-content');
        let html = `<h3>Nastavení otevíračky (15 dní)</h3>`;
        getDaysRange(15).forEach(date => {
            const conf = availability[date] || {status:'open', start:8, end:16};
            html += `<div class="setup-grid" data-date="${date}">
                <span>${date}</span>
                <select class="set-status"><option value="open" ${conf.status==='open'?'selected':''}>Otevřeno</option><option value="closed" ${conf.status==='closed'?'selected':''}>Zavřeno</option></select>
                <input type="number" class="set-start" value="${conf.start}">
                <input type="number" class="set-end" value="${conf.end}">
            </div>`;
        });
        html += `<button class="btn" style="width:100%; margin-top:20px" onclick="window.saveSchedule()">Uložit vše</button>`;
        container.innerHTML = html;
    };

    window.saveSchedule = () => {
        const data = {};
        document.querySelectorAll('.setup-grid').forEach(el => {
            data[el.dataset.date] = {
                status: el.querySelector('.set-status').value,
                start: parseInt(el.querySelector('.set-start').value),
                end: parseInt(el.querySelector('.set-end').value)
            };
        });
        set(ref(db, 'availability'), data).then(() => alert("Rozvrh na 15 dní uložen!"));
    };

    window.renderBarberOrders = (status) => {
        const container = document.getElementById('barber-content');
        container.innerHTML = `<h3>${status === 'pending' ? 'Čekající' : 'Historie'}</h3>`;
        bookings.filter(b => b.status === status).forEach(b => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `${b.date} - ${b.time} | ${b.name} 
                ${status==='pending' ? `<button onclick="window.updateStatus('${b.id}','done')">Hotovo</button>` : ''}`;
            container.appendChild(div);
        });
    };

    window.updateStatus = (id, stat) => update(ref(db, `bookings/${id}`), {status: stat});

    renderDays();
</script>
</body>
</html>
