<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRS Dejv Barber</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Goldman&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

<div class="container">
    <header>
        <div class="top-controls">
            <button class="music-toggle" id="music-btn" onclick="toggleMusic()">🎵 Hudba</button>
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">Světlý mód</button>
        </div>
        <img src="haircut.jpeg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>SRS King Barber</h1>
        <div id="nav-area" style="margin-top: 25px;">
            <button class="btn btn-outline" id="admin-login-btn" onclick="window.loginPrompt()">Vstup pro Barbera</button>
        </div>
    </header>

    <div id="view-customer">
        <div class="card">
            <h3 style="margin:0; color:var(--primary)">Rezervace termínu</h3>
            <input type="text" id="cust-name" placeholder="Zadejte své jméno">
            <div id="days-container" class="days-nav">Načítání dnů...</div>
            <div id="slots-container" class="slots-grid"></div>
        </div>
        <a href="https://www.instagram.com/proste_dejvv_?igsh=MTZubDVmOWpjd2EycA==" target="_blank" class="btn-ig">
            📸 Sleduj mě na Instagramu
        </a>
    </div>

    <div id="view-barber" class="hidden">
        <div class="barber-stats">
            <span class="level-text" id="barber-level-text">LEVEL 1</span>
            <div class="progress-container"><div id="chart-fill" class="progress-bar"></div></div>
            <div class="stats-info">
                <span>Ostříháno: <strong id="st-count">0</strong></span>
                <span>Do dalšího levelu zbývá: <strong id="st-next">?</strong></span>
            </div>
        </div>

        <div class="barber-nav">
            <button class="btn" id="btn-pending" onclick="window.renderBarberOrders('pending')">Aktivní</button>
            <button class="btn btn-outline" id="btn-done" onclick="window.renderBarberOrders('done')">Historie</button>
            <button class="btn btn-outline" onclick="window.showScheduleSetup()">📅 Rozvrh</button>
            <button class="btn btn-danger" onclick="window.resetAllData()" style="font-size: 0.7rem;">⚠️ SMAZAT VŠE</button>
        </div>
        <div id="barber-content"></div>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
